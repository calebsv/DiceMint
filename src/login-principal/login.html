<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>Entrar | Presença Escolar</title>
    <style>
        .mark{
            background-color: oklch(39.3% 0.095 152.535);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            transition: .4s;
        }
    </style>
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-200 p-4">
    <main class="bg-white grid grid-cols-1 md:grid-cols-2 shadow-md rounded-md overflow-hidden w-full max-w-4xl">
        <section class="bg-[url(./img/hero_login.png)] bg-cover p- h-64 md:h-full w-full"></section>
        <section class="p-8 mx-auto">
                <div>
                    <h1 class="font-semibold text-green-950 text-3xl py-2">Boas-Vindas!</h1>
                    <p class="pb-5 text-gray-700 font-medium">Acesse sua conta para continuar.</p>
                    <p class="pb-2 font-medium text-green-950">Como você acessa?</p>
                    <div class="flex gap-4 w-fit bg-gray-100 py-[9px] px-4 rounded-md mb-3">
                        <button id="aluno" class="mark">Aluno(a)</button>
                        <button id="escola">Servidor</button>
                        <button id="adm">Administrador</button>
                    </div>
                    <form action="" method="get">
                        <label class="font-medium" for="e-mail">E-mail</label>
                        <input class="block w-full h-[40px] border border-gray-400 rounded-md px-2 mb-3" type="text" name="email" id="e-mail" placeholder="Digite Seu E-mail">
                        <label class="font-medium" for="s-enha">Senha</label>
                        <input class="block w-full h-[40px] border border-gray-400 rounded-md px-2" type="password" name="senha" id="s-enha" placeholder="Digite Sua Senha">
                        <div class="flex justify-between pb-5 pt-[3px]">
                            <div><a href="cadastro.html" target="_blank" class="text-sm text-green-950">Primeiro Acesso</a></div>
                            <div><a href="#" class="text-sm text-green-950">Esqueci a senha?</a></div>
                        </div>
                        <button class="my-3 text-center font-semibold text-white bg-green-900 hover:bg-green-950 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 px-5 py-[9px] rounded-md w-full" type="submit"><i class="bi bi-box-arrow-in-right px-1"></i> Entrar no Sistema</button>
                    </form>
                    <div class="flex items-center gap-3 pt-3">
                        <span class="flex-1 border-t border-gray-300"></span>
                        <p class="text-center text-sm text-gray-600">Precisa de Ajuda?</p>
                        <span class="flex-1 border-t border-gray-300"></span>
                    </div>
                    <p class="text-center text-sm py-3 w-80 text-gray-500">Procure o suporte da instituição para obter ou recuperar seu acesso.</p>
                </div>
        </section>
    </main>
    <script>
        let aluno = document.getElementById('aluno')
        let escola = document.getElementById('escola')
        let adm = document.getElementById('adm')

        aluno.onclick = function(){
            aluno.classList.add('mark')
            escola.classList.remove('mark')
            adm.classList.remove('mark')
        }
        escola.onclick = function(){
            escola.classList.add('mark')
            aluno.classList.remove('mark')
            adm.classList.remove('mark')
        }
        adm.onclick = function(){
            adm.classList.add('mark')
            aluno.classList.remove('mark')
            escola.classList.remove('mark')
        }
    </script>
</body>
</html>
