<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>Cadastro | Presença Escolar</title>
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-200 p-4">
    <main class="bg-white grid grid-cols-1 md:grid-cols-2 shadow-md rounded-md overflow-hidden w-full max-w-4xl">
        <section class="bg-[url(./img/hero_login.png)] bg-cover p- h-64 md:h-full w-full"></section>
        <section class="p-8 mx-auto">
                <div>
                    <h1 class="font-semibold text-green-950 text-3xl py-2">Boas-Vindas!</h1>
                    <p class="pb-5 text-gray-700 font-medium">Cadastre-se para acessar o sistema.</p>
                    <form action="" method="get">
                        <label class="font-medium" for="e-mail">Nome</label>
                        <input class="block w-full h-[40px] border border-gray-400 rounded-md px-2 mb-3" type="text" name="email" id="e-mail" placeholder="Digite Seu Nome" required>
                        <label class="font-medium" for="e-mail">E-mail</label>
                        <input class="block w-full h-[40px] border border-gray-400 rounded-md px-2 mb-3" type="text" name="email" id="e-mail" placeholder="Digite Seu E-mail" required>
                        <label class="font-medium" for="s-enha">Senha</label>
                        <input class="block w-full h-[40px] border border-gray-400 rounded-md px-2 mb-3" type="password" name="senha" id="s-enha" placeholder="Crie Sua Senha" required>
                        <label class="font-medium" for="turma">Turma</label>
                        <select class="block w-full border border-gray-400 h-[40px] rounded-md px-2 mb-3" name="nturma" id="turma" required>
                            <option class="text-gray-400" value="" disabled selected>Escolha sua Turma</option>
                            <option value="1º A">1º A</option>
                            <option value="1º B">1º B</option>
                            <option value="1º C">1º C</option>
                            <option value="1º D">1º D</option>
                            <option value="2º A">2º A</option>
                            <option value="2º B">2º B</option>
                            <option value="2º C">2º C</option>
                            <option value="2º D">2º D</option>
                            <option value="3º A">3º A</option>
                            <option value="3º B">3º B</option>
                            <option value="3º C">3º C</option>
                            <option value="3º D">3º D</option>
                            <option value="Não se aplica">Não se aplica</option>
                        </select>
                        <label class="font-medium" for="turma">Tipo</label>
                        <select class="block w-full border border-gray-400 h-[40px] rounded-md px-2 mb-3" name="nturma" id="turma" required>
                            <option class="text-gray-400" value="" disabled selected>Escolha sua Função</option>
                            <option value="Aluno(a)">Aluno(a)</option>
                            <option value="Servidor">Servidor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                        <button class="my-3 text-center font-semibold text-white bg-green-900 hover:bg-green-950 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 px-5 py-[9px] rounded-md w-full" type="submit"><i class="bi bi-box-arrow-in-right px-1"></i> Verificar Primeiro Acesso</button>
                    </form>
                    <div class="text-center"><a href="login.html" target="_blank" class="text-sm text-gray-500">Voltar <i class="bi bi-box-arrow-up-left"></i></a></div>
                    <div class="flex items-center gap-3 pt-3">
                        <span class="flex-1 border-t border-gray-300"></span>
                        <p class="border-l text-center text-sm text-gray-600">Precisa de Ajuda?</p>
                        <span class="flex-1 border-t border-gray-300"></span>
                    </div>
                    <p class="text-center text-sm py-3 w-80 text-gray-500">Procure o suporte da instituição para obter ou recuperar seu acesso.</p>
                </div>
        </section>
    </main>
</body>
</html>
